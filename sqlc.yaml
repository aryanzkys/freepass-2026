version: "2"
sql:
  - schema: internal/sqlc/schema.sql
    queries: internal/sqlc/queries
    engine: postgresql
    gen:
      go:
        package: db
        out: internal/sqlc/gen
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
