          example: 5e5b3d10-2f7c-4c7c-9e1a-6f2b8b9e0a22
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  description: Verification action.
                  enum:
                    - APPROVE
                    - REJECT
                reason:
                  nullable: true
                  oneOf:
                    - type: string
                    - type: "null"
                  description: Required when action=REJECT.
              required:
                - action
            examples:
              approve:
                $ref: "#/components/examples/OwnerVerifyApproveRequest"
              reject:
                $ref: "#/components/examples/OwnerVerifyRejectRequest"
