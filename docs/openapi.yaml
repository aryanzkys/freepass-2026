paths:
  /health:
    get:
      tags:
        - User
      summary: Health check
      description: |-
        Lightweight liveness endpoint to verify the service is running.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required:
                  - status
              examples:
                success:
                  value:
                    status: ok
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register user
      description: |-
        Creates a new user account. Email is normalized to lowercase.
        Passwords are hashed server-side. Returns the created user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Display name.
                email:
                  type: string
                  description: Email address (lowercased during processing).
                password:
                  type: string
                  description: Plain-text password (hashed on server).
                phone:
                  nullable: true
                  oneOf:
                    - type: string
                    - type: "null"
                  description: Optional phone number.
              required:
                - name
                - email
                - password
            examples:
              minimal:
                $ref: "#/components/examples/RegisterRequestMinimal"
              full:
                $ref: "#/components/examples/RegisterRequestFull"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                success:
                  $ref: "#/components/examples/RegisterSuccess"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validation_error:
                  $ref: "#/components/examples/ErrorValidation"
        "409":
          description: Email exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                conflict:
                  $ref: "#/components/examples/ErrorConflict"
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      description: |-
        Authenticates a user and returns a JWT access token. The token includes
        claims: subject (user ID) and role. Expiration is enforced by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Email address.
                password:
                  type: string
                  description: Plain-text password.
              required:
                - email
                - password
            examples:
              minimal:
                $ref: "#/components/examples/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              examples:
                success:
                  $ref: "#/components/examples/LoginSuccess"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validation_error:
                  $ref: "#/components/examples/ErrorValidation"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  $ref: "#/components/examples/ErrorUnauthorized"
  /canteens:
    get:
      tags:
        - User
      summary: List canteens
      description: |-
        Returns all canteens. Public endpoint. Use this for discovery.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponseCanteen"
              examples:
                success:
                  $ref: "#/components/examples/CanteenListSuccess"
                empty:
                  $ref: "#/components/examples/CanteenListEmpty"
  /canteens/{canteenId}/menus:
    get:
      tags:
        - User
      summary: List menu items by canteen with ratings
      description: |-
        Returns menu items for a canteen including aggregate ratings and recommendation flags.
      parameters:
        - in: path
          name: canteenId
          required: true
          schema:
            type: string
            format: uuid
          description: Canteen ID.
          example: 9c3a3b71-9f8c-4b0b-86a9-4f5c0f9e0a11
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponseMenuItem"
              examples:
                success:
                  $ref: "#/components/examples/MenuListSuccess"
                empty:
                  $ref: "#/components/examples/MenuListEmpty"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validation_error:
                  $ref: "#/components/examples/ErrorValidation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                not_found:
                  $ref: "#/components/examples/ErrorNotFound"
  /canteens/{canteenId}/ai/recommendation-explain:
    get:
      tags:
        - AI
      summary: Explain canteen or menu recommendation
      description: |-
        Returns an AI-generated explanation of why a canteen or menu item is recommended.
        Read-only. Uses aggregated data only and does not reveal PII.
        Requires any authenticated role (USER, OWNER, ADMIN).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: canteenId
          required: true
          schema:
            type: string
            format: uuid
          description: Canteen ID.
          example: 9c3a3b71-9f8c-4b0b-86a9-4f5c0f9e0a11
        - in: query
          name: days
          required: false
          schema:
            type: integer
            minimum: 7
            maximum: 90
          description: Aggregation window in days.
          example: 30
        - in: query
          name: menu_item_id
          required: false
          schema:
            type: string
            format: uuid
          description: Optional menu item ID to explain item-specific recommendation.
          example: 7c7a3d10-2f7c-4c7c-9e1a-6f2b8b9e0a11
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIRecommendationExplainResponse"
              examples:
                success:
                  $ref: "#/components/examples/UserAIExplainSuccess"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validation_error:
                  $ref: "#/components/examples/ErrorValidation"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  $ref: "#/components/examples/ErrorUnauthorized"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                forbidden:
                  $ref: "#/components/examples/ErrorForbidden"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                not_found:
                  $ref: "#/components/examples/ErrorNotFound"
        "502":
          description: AI error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ai_invalid_response:
                  $ref: "#/components/examples/ErrorAIInvalidResponse"
        "503":
          description: AI not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ai_not_configured:
                  $ref: "#/components/examples/ErrorAINotConfigured"
  /orders:
    post:
      tags:
        - Orders
      summary: Create order
      description: |-
        Creates a new order with atomic stock locking. The operation is transactional:
        stock is locked and decremented, order and items are created, or the entire
        request fails. For CASHLESS_QRIS, order_status starts at PAYMENT.
        Requires USER role; ADMIN bypass allowed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                canteen_id:
                  type: string
                  description: Canteen ID.
                  format: uuid
                payment_method:
                  type: string
                  description: Payment method. Defaults to CASH.
                  enum:
                    - CASH
                    - CASHLESS_QRIS
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      menu_item_id:
                        type: string
                        format: uuid
                        description: Menu item ID.
                      qty:
                        type: integer
                        description: Quantity (must be > 0).
                    required:
                      - menu_item_id
                      - qty
              required:
                - canteen_id
                - items
            examples:
              minimal:
                $ref: "#/components/examples/CreateOrderMinimal"
              full:
                $ref: "#/components/examples/CreateOrderFull"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
              examples:
                success:
                  $ref: "#/components/examples/CreateOrderSuccess"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validation_error:
                  $ref: "#/components/examples/ErrorValidation"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  $ref: "#/components/examples/ErrorUnauthorized"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                forbidden:
                  $ref: "#/components/examples/ErrorForbidden"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                not_found:
                  $ref: "#/components/examples/ErrorNotFound"
  /orders/{orderId}/payments:
    post:
      tags:
        - Payments
      summary: Create payment
      description: |-
        Records a CASH payment for an order and marks payment_status=PAID.
        Only valid for orders with payment_method=CASH.
        Requires USER role; ADMIN bypass allowed.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
          description: Order ID.
          example: 5e5b3d10-2f7c-4c7c-9e1a-6f2b8b9e0a22
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  description: Payment method label.
                amount:
                  type: integer
                  description: Must equal order total.
              required:
                - method
                - amount
            examples:
              minimal:
                $ref: "#/components/examples/PaymentRequestMinimal"
              full:
                $ref: "#/components/examples/PaymentRequestFull"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrderResponse"
              examples:
                success:
                  $ref: "#/components/examples/PaymentSuccess"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validation_error:
                  $ref: "#/components/examples/ErrorValidation"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  $ref: "#/components/examples/ErrorUnauthorized"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                forbidden:
                  $ref: "#/components/examples/ErrorForbidden"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                not_found:
                  $ref: "#/components/examples/ErrorNotFound"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                conflict:
                  $ref: "#/components/examples/ErrorConflict"
  /orders/{orderId}/feedback:
    post:
      tags:
        - Orders
      summary: Create feedback with ratings
      description: |-
        Creates feedback for a completed and paid order. Each menu item in the order
        must be rated exactly once. Transactions ensure feedback and ratings are written together.
        Requires USER role; ADMIN bypass allowed.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
          description: Order ID.
          example: 5e5b3d10-2f7c-4c7c-9e1a-6f2b8b9e0a22
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  nullable: true
                  oneOf:
                    - type: string
                    - type: "null"
                  description: Optional free-form comment.
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      menu_item_id:
                        type: string
                        format: uuid
                        description: Menu item ID.
                      rating:
                        type: integer
                        description: Rating 1-5.
                    required:
                      - menu_item_id
                      - rating
              required:
                - items
            examples:
              minimal:
                $ref: "#/components/examples/FeedbackRequestMinimal"
              full:
                $ref: "#/components/examples/FeedbackRequestFull"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"
              examples:
                success:
                  $ref: "#/components/examples/FeedbackSuccess"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validation_error:
                  $ref: "#/components/examples/ErrorValidation"
        "401":
          description: Unauthorized
          content:
