openapi: 3.0.3
info:
  title: BCC Canteen API
  version: 1.0.0
  description: |
    BCC Canteen is a canteen ordering backend that supports three actor roles: USER, OWNER, and ADMIN.

    Roles:
    - USER: browse menus, create orders, pay, and leave feedback.
    - OWNER: manage menus, process incoming orders, and verify cashless payments.
    - ADMIN: manage owner accounts and oversee system health.

    Payment methods:
    - CASH
    - CASHLESS_QRIS

    Order state machine:
    - CASH flow: WAITING → COOKING → READY → COMPLETED
    - CASHLESS_QRIS flow: PAYMENT → WAITING → COOKING → READY → COMPLETED

    Payment state machine:
    - UNPAID → AWAITING_VERIFICATION → PAID
    - UNPAID → REJECTED → REFUNDED

    Payment verification (CASHLESS_QRIS):
    1) Order is created with order_status=PAYMENT and payment_status=UNPAID.
    2) User retrieves QRIS static URL for the canteen.
    3) User confirms payment, order_status becomes WAITING and payment_status becomes AWAITING_VERIFICATION.
    4) Owner verifies payment: APPROVE sets payment_status=PAID; REJECT sets payment_status=REJECTED and creates a refund record.

    AI features provide read-only, aggregated insights and never modify transactional data.

    Authentication:
    - JWT is required for protected endpoints.
    - Send the token via Authorization header: Bearer <token>.
    - Tokens include user ID and role claims; expiration is enforced by the server.

    Standard error contract:
    - 400: validation_error
    - 401: unauthorized
    - 403: forbidden
    - 404: not_found
    - 409: conflict
    - 500: internal_error
    - 502: ai_invalid_response
    - 503: ai_not_configured
servers:
  - url: http://localhost:8080
tags:
  - name: Authentication
  - name: User
  - name: Orders
  - name: Payments
  - name: Owner
  - name: Admin
  - name: AI
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT authentication via Authorization header.
        Example: Authorization: Bearer <token>
  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Machine-readable error code.
        details:
          nullable: true
          oneOf:
            - type: object
            - type: "null"
          description: Optional object with field-level error details.
      required:
        - message
        - details
    OrderStatus:
      type: string
      description: |
        Order lifecycle status.
        - PAYMENT: awaiting cashless confirmation
        - WAITING: accepted and queued
        - COOKING: being prepared
        - READY: ready for pickup
        - COMPLETED: fulfilled
      enum:
        - PAYMENT
        - WAITING
        - COOKING
        - READY
        - COMPLETED
    PaymentStatus:
      type: string
      description: |
        Payment lifecycle status.
        - UNPAID: not paid
        - AWAITING_VERIFICATION: cashless payment confirmed by user, pending owner verification
        - PAID: verified paid
        - REJECTED: payment rejected by owner
        - REFUNDED: refund processed
      enum:
        - UNPAID
        - AWAITING_VERIFICATION
        - PAID
        - REJECTED
        - REFUNDED
    PaymentMethod:
      type: string
      description: Payment method selected at order creation.
      enum:
        - CASH
        - CASHLESS_QRIS
    User:
      type: object
      properties:
        id:
          type: string
          description: User ID.
        name:
          type: string
          description: Display name.
        email:
          type: string
          description: Email address used for login.
        role:
          type: string
          description: User role.
        phone:
          nullable: true
          oneOf:
            - type: string
            - type: "null"
          description: Optional phone number.
      required:
        - id
        - name
        - email
        - role
    UserWithTimestamps:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            created_at:
              type: string
            updated_at:
              type: string
          required:
            - created_at
            - updated_at
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        user:
          $ref: "#/components/schemas/User"
      required:
        - access_token
        - token_type
        - expires_in
        - user
    Canteen:
      type: object
      properties:
        id:
          type: string
          description: Canteen ID.
        name:
          type: string
          description: Canteen name.
        location:
          nullable: true
          oneOf:
            - type: string
            - type: "null"
          description: Optional location.
        owner_id:
          type: string
          description: Owner user ID.
        created_at:
          type: string
          description: RFC3339 timestamp.
        updated_at:
          type: string
          description: RFC3339 timestamp.
      required:
        - id
        - name
        - owner_id
        - created_at
        - updated_at
    MenuItem:
      type: object
      properties:
        id:
          type: string
          description: Menu item ID.
        canteen_id:
          type: string
          description: Canteen ID.
        name:
          type: string
          description: Menu item name.
        description:
          nullable: true
          oneOf:
            - type: string
            - type: "null"
          description: Optional description.
        price:
          type: integer
          description: Unit price.
        stock:
          type: integer
          description: Current stock.
        is_available:
          type: boolean
          description: Availability flag.
        avg_rating:
          nullable: true
          oneOf:
            - type: number
              format: float
            - type: "null"
          description: Average rating across non-removed ratings.
        rating_count:
          type: integer
          description: Number of ratings.
        is_recommended:
          type: boolean
          description: Recommendation flag based on rating rank.
        recommended_rank:
          nullable: true
          oneOf:
            - type: integer
            - type: "null"
          description: Ranking order among recommended items.
        created_at:
          type: string
          description: RFC3339 timestamp.
        updated_at:
          type: string
          description: RFC3339 timestamp.
      required:
        - id
        - canteen_id
        - name
        - price
        - stock
        - is_available
        - rating_count
        - is_recommended
        - created_at
        - updated_at
    Order:
      type: object
      properties:
        id:
          type: string
          description: Order ID.
        user_id:
          type: string
          description: User ID.
        canteen_id:
          type: string
          description: Canteen ID.
        payment_method:
          $ref: "#/components/schemas/PaymentMethod"
        payment_status:
          $ref: "#/components/schemas/PaymentStatus"
        order_status:
          $ref: "#/components/schemas/OrderStatus"
        total_amount:
          type: integer
          description: Total order amount.
        created_at:
          type: string
          description: RFC3339 timestamp.
        updated_at:
          type: string
          description: RFC3339 timestamp.
      required:
        - id
        - user_id
        - canteen_id
        - payment_method
        - payment_status
        - order_status
        - total_amount
        - created_at
        - updated_at
    OrderItem:
      type: object
      properties:
        id:
          type: string
          description: Order item ID.
        order_id:
          type: string
          description: Order ID.
        menu_item_id:
          type: string
          description: Menu item ID.
        qty:
          type: integer
          description: Quantity ordered.
        price_snapshot:
          type: integer
          description: Unit price at order time.
        subtotal:
          type: integer
          description: qty * price_snapshot.
        created_at:
          type: string
          description: RFC3339 timestamp.
        updated_at:
          type: string
          description: RFC3339 timestamp.
      required:
        - id
        - order_id
        - menu_item_id
        - qty
        - price_snapshot
        - subtotal
        - created_at
        - updated_at
    Payment:
      type: object
      properties:
        id:
          type: string
          description: Payment ID.
        order_id:
          type: string
          description: Order ID.
        method:
          nullable: true
          oneOf:
            - type: string
            - type: "null"
          description: Payment method label provided by client.
        amount:
          type: integer
          description: Payment amount.
        status:
          type: string
          description: Payment record status.
        paid_at:
          type: string
          description: RFC3339 timestamp.
        created_at:
          type: string
          description: RFC3339 timestamp.
        updated_at:
          type: string
          description: RFC3339 timestamp.
      required:
        - id
        - order_id
        - amount
        - status
        - paid_at
        - created_at
        - updated_at
    Feedback:
      type: object
      properties:
        id:
          type: string
          description: Feedback ID.
        order_id:
          type: string
          description: Order ID.
        user_id:
          type: string
          description: User ID.
        canteen_id:
          type: string
          description: Canteen ID.
        rating:
          nullable: true
          oneOf:
            - type: integer
            - type: "null"
          description: Optional overall rating.
        comment:
          nullable: true
          oneOf:
            - type: string
            - type: "null"
          description: Optional free-form comment.
        is_removed:
          type: boolean
          description: Soft deletion flag.
        created_at:
          type: string
          description: RFC3339 timestamp.
        updated_at:
          type: string
          description: RFC3339 timestamp.
      required:
        - id
        - order_id
        - user_id
        - canteen_id
        - is_removed
        - created_at
        - updated_at
    ListResponseCanteen:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Canteen"
      required:
        - data
    ListResponseMenuItem:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MenuItem"
      required:
        - data
    ListResponseOrder:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
      required:
        - data
    CreateOrderResponse:
      type: object
      properties:
        order:
          $ref: "#/components/schemas/Order"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
      required:
        - order
        - items
    PaymentOrderResponse:
      type: object
      properties:
        payment:
          $ref: "#/components/schemas/Payment"
        order:
          $ref: "#/components/schemas/Order"
      required:
        - payment
        - order
    FeedbackResponse:
      type: object
      properties:
        feedback:
          $ref: "#/components/schemas/Feedback"
      required:
        - feedback
    QRISInfo:
      type: object
      properties:
        order_id:
          type: string
          description: Order ID.
        canteen_id:
          type: string
          description: Canteen ID.
        qris_static_url:
          type: string
          description: QRIS static URL for payment.
        order_status:
          $ref: "#/components/schemas/OrderStatus"
        payment_status:
          $ref: "#/components/schemas/PaymentStatus"
        total_amount:
          type: integer
          description: Total order amount.
      required:
        - order_id
        - canteen_id
        - qris_static_url
        - order_status
        - payment_status
        - total_amount
    PaymentVerification:
      type: object
      properties:
        id:
          type: string
          description: Verification ID.
        order_id:
          type: string
          description: Order ID.
        canteen_id:
          type: string
          description: Canteen ID.
        user_id:
          type: string
          description: User ID.
        status:
          type: string
          description: Verification status.
        rejection_reason:
          nullable: true
          oneOf:
            - type: string
            - type: "null"
          description: Optional rejection reason.
        created_at:
          type: string
          description: RFC3339 timestamp.
        updated_at:
          type: string
          description: RFC3339 timestamp.
      required:
        - id
        - order_id
        - canteen_id
        - user_id
        - status
        - created_at
        - updated_at
    Refund:
      type: object
      properties:
        id:
          type: string
          description: Refund ID.
        order_id:
          type: string
          description: Order ID.
        canteen_id:
          type: string
          description: Canteen ID.
        user_id:
          type: string
          description: User ID.
        amount:
          type: integer
          description: Refund amount.
        reason:
          type: string
          description: Refund reason.
        status:
          type: string
          description: Refund status.
        created_at:
          type: string
          description: RFC3339 timestamp.
        updated_at:
          type: string
          description: RFC3339 timestamp.
      required:
        - id
        - order_id
        - canteen_id
        - user_id
        - amount
        - reason
        - status
        - created_at
        - updated_at
    QRISConfirmResponse:
      type: object
      properties:
        order:
          $ref: "#/components/schemas/Order"
        verification:
          $ref: "#/components/schemas/PaymentVerification"
      required:
        - order
        - verification
    OwnerVerifyPaymentResponse:
      type: object
      properties:
        order:
          $ref: "#/components/schemas/Order"
        verification:
          $ref: "#/components/schemas/PaymentVerification"
        refund:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/Refund"
            - type: "null"
      required:
        - order
        - verification
    CanteenWithQRIS:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        location:
          nullable: true
          oneOf:
            - type: string
            - type: "null"
        owner_id:
          type: string
        qris_static_url:
          nullable: true
          oneOf:
            - type: string
            - type: "null"
        qris_static_updated_at:
          nullable: true
          oneOf:
            - type: string
            - type: "null"
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - name
        - owner_id
        - created_at
        - updated_at
    AdminCanteenResponse:
      type: object
      properties:
        canteen:
          $ref: "#/components/schemas/CanteenWithQRIS"
      required:
        - canteen
    AdminUserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserWithTimestamps"
      required:
        - user
    DeleteResponse:
      type: object
      properties:
        deleted:
          type: boolean
      required:
        - deleted
    AIFeedbackInsightsResponse:
      type: object
      properties:
        canteen_id:
          type: string
        range_days:
          type: integer
        summary:
          type: string
        sentiment:
          type: object
          properties:
            label:
              type: string
            score:
              type: number
          required:
            - label
            - score
        top_themes:
          type: array
          items:
            type: object
            properties:
              theme:
                type: string
              count:
                type: integer
            required:
              - theme
              - count
        action_items:
          type: array
          items:
            type: string
        notable_quotes:
          type: array
          items:
            type: string
        generated_at:
          type: string
        model:
          type: string
      required:
        - canteen_id
        - range_days
        - summary
        - sentiment
        - top_themes
        - action_items
        - notable_quotes
        - generated_at
        - model
    AIRecommendationExplainResponse:
      type: object
      properties:
        canteen_id:
          type: string
        menu_item_id:
          nullable: true
          oneOf:
            - type: string
            - type: "null"
        explanation:
          type: string
        signals:
          type: array
          items:
            type: object
            properties:
              signal:
                type: string
              value:
                type: string
            required:
              - signal
              - value
        generated_at:
          type: string
        model:
          type: string
      required:
        - canteen_id
        - menu_item_id
        - explanation
        - signals
        - generated_at
        - model
    AIOversightResponse:
      type: object
      properties:
        range_days:
          type: integer
        watchlist:
          type: array
          items:
            type: object
            properties:
              canteen_id:
                type: string
              canteen_name:
                type: string
              risk_summary:
                type: string
              top_complaints:
                type: array
                items:
                  type: string
              suggested_followups:
                type: array
                items:
                  type: string
            required:
              - canteen_id
              - canteen_name
              - risk_summary
              - top_complaints
              - suggested_followups
        generated_at:
          type: string
        model:
          type: string
      required:
        - range_days
        - watchlist
        - generated_at
        - model
